
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd1e8, #f7a8d2, #ffe4f1);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow-x: hidden;
    color: #a52c70;
}

.container {
    padding: 25px;
    z-index: 2;
}

h1 {
    font-size: 32px;
}

button {
    background: #ff4fa3;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 5px 15px #d86b9f;
}

#photo {
    display: none;
    width: min(85vw, 420px);
    max-height: 70vh;
    object-fit: contain;
    border: 7px solid white;
    border-radius: 22px;
    box-shadow: 0 8px 30px #c94c8b;
    cursor: pointer;
    animation: appear 1s;
}

@keyframes appear {
    from {opacity: 0; transform: scale(.8);}
    to {opacity: 1; transform: scale(1);}
}

#message {
    font-size: 23px;
    margin-top: 20px;
}

.snow {
    position: fixed;
    top: -20px;
    color: white;
    pointer-events: none;
    z-index: 5;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.2;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>❤️ A Special Moment ❤️</h1>

    <p>Саған арналған кішкентай тосынсый...</p>

    <button id="openBtn" onclick="openPhoto()">
        Фотоны ашу 💗
    </button>

    <br><br>

<img id="photo"
     src="photo1.jpg"
     alt="Our Photo"
     style="max-width:100%"
     onclick="startMagic()">

<div id="message"></div>

</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
let started = false;
let snowTimer;

function openPhoto() {
    document.getElementById("photo").style.display = "inline-block";
    document.getElementById("openBtn").style.display = "none";
}

function startMagic() {
    if (started) return;
    started = true;

    document.getElementById("message").innerHTML =
        "❄️ Every moment is special ❤️";

    const music = document.getElementById("music");
    music.play().catch(() => {
        document.getElementById("message").innerHTML =
            "❄️ Қар жауып жатыр ❤️ Музыканы қайта басып қосуға болады.";
    });

    snowTimer = setInterval(createSnow, 120);
}

function createSnow() {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.innerHTML = "❄";

    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = (10 + Math.random() * 20) + "px";
    snow.style.animationDuration = (3 + Math.random() * 5) + "s";

    document.body.appendChild(snow);

    setTimeout(() => snow.remove(), 8000);
}
</script>

</body>
</html>
